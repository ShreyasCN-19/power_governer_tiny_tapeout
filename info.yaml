# Tiny Tapeout project information
project:
  title: "PwrGov-X: Telemetry-Driven Power Governor"
  author: "Shreyas C N"
  discord: ""
  description: "Telemetry-driven power governor with workload classification, trend prediction, and thermal throttling."
  language: "Verilog"
  clock_hz: 50000000

  tiles: "1x1"
  top_module: "tt_um_pwrgovx"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "Enable request"
  ui[1]: "Activity input"
  ui[2]: "Temperature bit 0"
  ui[3]: "Temperature bit 1"
  ui[4]: "Temperature bit 2"
  ui[5]: "Reserved"
  ui[6]: "Reserved"
  ui[7]: "Reserved"

  # Outputs
  uo[0]: "Performance enable"
  uo[1]: "Throttle active"
  uo[2]: "Control level bit 0"
  uo[3]: "Control level bit 1"
  uo[4]: "Workload class bit 0"
  uo[5]: "Workload class bit 1"
  uo[6]: "Mode bit 0"
  uo[7]: "Mode bit 1"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
